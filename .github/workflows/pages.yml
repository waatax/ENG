name: Deploy English Quest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify quest content, progress and reward rules
        run: node --test scripts/test_quest_game.mjs scripts/test_quest_coach.mjs scripts/test_quest_placement.mjs scripts/test_quest_school.mjs scripts/test_quest_quality.mjs scripts/test_quest_exams.mjs scripts/test_simulation.mjs scripts/test_learning_lab.mjs

      - name: Verify every quest pool has enough distinct learning targets
        run: node scripts/audit_quest_quality.mjs

      - name: Verify 1000 mnemonic cards, 500 word families and their MP3s
        run: node scripts/validate_mnemonic_release.mjs

      - name: Verify mnemonic flip timing and recall compatibility
        run: node --test scripts/test_mnemonic_flip.mjs scripts/test_mnemonic_playlist.mjs scripts/test_mnemonic_recall.mjs

      - name: Verify all vocabulary cards and MP3 boundaries
        run: node --test scripts/test_word_queue.mjs scripts/test_vocabulary_platform.mjs scripts/test_word_mp3.mjs scripts/test_audio_completion.mjs scripts/test_english_academy.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
